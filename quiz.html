<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <title>乘法小達人｜隨機挑戰</title>
    <meta name="theme-color" content="#f4fbff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="乘法小達人">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="pwa.css?v=20260906-084437">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="design-tokens.css?v=20260906-084437">
    <script src="theme-init.js?v=20260906-084437"></script>
    <style>
        .numeric-pad {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.375rem;
        }

        .quiz-header {
            width: 100%;
            padding: 0.75rem 3.25rem;
            border: 1px solid var(--ds-border);
            border-radius: var(--ds-radius-lg);
            background: var(--ds-surface);
            box-shadow: var(--ds-shadow-sm);
            backdrop-filter: blur(18px) saturate(135%);
            -webkit-backdrop-filter: blur(18px) saturate(135%);
        }

        .quiz-legend {
            color: var(--ds-text-muted);
            font-size: 0.6875rem;
            font-weight: 700;
            line-height: 1;
        }

        .quiz-factor-one {
            color: var(--ds-factor-one);
        }

        .quiz-factor-two {
            color: var(--ds-factor-two);
        }

        .safe-keypad {
            border: 1px solid var(--ds-border);
            background: var(--ds-surface);
            box-shadow: 0 -12px 32px var(--ds-shadow-color, rgb(15 23 42 / 0.14));
            backdrop-filter: blur(24px) saturate(165%);
            -webkit-backdrop-filter: blur(24px) saturate(165%);
        }

        .floating-keypad {
            left: auto;
            right: auto;
            bottom: auto;
            width: min(18rem, calc(100vw - 1rem));
            border-radius: var(--ds-radius-lg);
            border: 1px solid var(--ds-border);
            background: var(--ds-surface);
            box-shadow: var(--ds-shadow-md);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: left 180ms ease, top 180ms ease, transform 180ms ease, opacity 180ms ease, box-shadow 180ms ease;
        }

        .safe-keypad:not(.floating-keypad) {
            border-top-left-radius: var(--ds-radius-lg);
            border-top-right-radius: var(--ds-radius-lg);
            background: var(--ds-surface);
            overflow: visible;
        }

        .floating-keypad.keypad-snap-preview {
            transform: scale(0.985);
            opacity: 0.96;
            border-color: rgb(59 130 246 / 0.58);
            box-shadow: 0 10px 24px rgb(37 99 235 / 0.2), 0 0 0 2px rgb(147 197 253 / 0.28);
        }

        .floating-keypad.is-dragging {
            transition: none;
        }

        .keypad-dock {
            display: none;
            position: fixed;
            z-index: 40;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgb(59 130 246 / 0.48);
            border-radius: 1rem;
            background: rgb(219 234 254 / 0.42);
            color: rgb(37 99 235);
            font-size: 0.75rem;
            font-weight: 700;
            pointer-events: none;
            transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .keypad-dock.is-visible {
            display: flex;
        }

        .keypad-dock.is-hovered {
            border-color: rgb(37 99 235 / 0.9);
            background: rgb(191 219 254 / 0.7);
            box-shadow: 0 0 0 4px rgb(147 197 253 / 0.3);
        }

        .floating-keypad-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 1.75rem;
            color: rgb(100 116 139);
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .floating-keypad-handle:active {
            cursor: grabbing;
        }

        .keypad-close {
            display: flex;
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid rgb(148 163 184 / 0.45);
            border-radius: 9999px;
            background: rgb(255 255 255 / 0.78);
            color: rgb(71 85 105);
            font-size: 1.25rem;
            line-height: 1;
            box-shadow: 0 8px 18px rgb(15 23 42 / 0.16);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .floating-keypad .keypad-close {
            top: -0.65rem;
            right: -0.65rem;
        }

        .keypad-close:hover {
            background: var(--ds-surface-strong);
            color: var(--ds-brand-strong);
        }

        .completion-overlay {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none;
            overflow: hidden;
            padding: calc(0.75rem + env(safe-area-inset-top)) 1rem 0;
        }

        .completion-card {
            position: relative;
            pointer-events: auto;
            width: min(100%, 32rem);
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--ds-border-strong);
            border-radius: 9999px;
            background: var(--ds-surface-strong);
            box-shadow: var(--ds-shadow-md);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            animation: completion-pop 420ms cubic-bezier(.22, 1.2, .36, 1) both;
            touch-action: pan-y;
            -webkit-user-select: none;
            user-select: none;
        }

        .completion-card.score-good {
            border-color: var(--ds-accent);
        }

        .completion-card.score-steady {
            border-color: var(--ds-brand);
        }

        .completion-card.score-keep-going {
            border-color: var(--ds-success);
        }

        .completion-card.score-good .completion-emoji {
            animation-name: completion-sparkle;
        }

        .completion-card.score-steady .completion-emoji {
            animation-name: completion-pulse;
        }

        .completion-card.score-keep-going .completion-emoji {
            animation-name: completion-sway;
        }

        .completion-close {
            position: absolute;
            top: -0.65rem;
            right: -0.65rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid var(--ds-border);
            border-radius: 9999px;
            background: var(--ds-surface-strong);
            color: var(--ds-text-muted);
            font-size: 1.25rem;
            line-height: 1;
            pointer-events: auto;
            box-shadow: var(--ds-shadow-sm);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .completion-close:hover {
            background: var(--ds-surface-strong);
            color: var(--ds-brand-strong);
        }

        .completion-emoji {
            font-size: 1.5rem;
            line-height: 1;
            animation: completion-bounce 700ms ease-in-out both;
        }

        .quiz-question-list {
            overflow-y: auto;
            overscroll-behavior: contain;
            align-content: start;
            align-items: start;
            grid-auto-rows: max-content;
            padding-top: var(--quiz-header-reserve, 7rem);
            padding-bottom: var(--quiz-scroll-reserve, 15rem);
            scrollbar-gutter: stable;
        }

        .quiz-question-card {
            background: var(--ds-surface);
            border-color: var(--ds-border);
            backdrop-filter: blur(12px) saturate(125%);
            -webkit-backdrop-filter: blur(12px) saturate(125%);
        }

        .quiz-question-card.quiz-card-success {
            background: var(--ds-success-soft);
            border-color: var(--ds-success);
        }

        .quiz-question-card.quiz-card-error {
            background: var(--ds-danger-soft);
            border-color: var(--ds-danger);
        }

        .quiz-question-card.quiz-card-idle {
            border-color: var(--ds-border);
        }

        .completion-confetti {
            position: absolute;
            inset: 0;
        }

        .completion-confetti span {
            position: absolute;
            top: 42%;
            left: 50%;
            width: 0.55rem;
            height: 1rem;
            border-radius: 999px;
            background: var(--confetti-color);
            animation: confetti-burst 1200ms cubic-bezier(.15, .8, .35, 1) both;
            animation-delay: var(--confetti-delay);
            transform: rotate(var(--confetti-rotate));
        }

        .completion-confetti span:nth-child(1) { --confetti-color: #f59e0b; --confetti-delay: 20ms; --confetti-rotate: 12deg; --confetti-x: -35vw; --confetti-y: -25vh; }
        .completion-confetti span:nth-child(2) { --confetti-color: #10b981; --confetti-delay: 50ms; --confetti-rotate: 80deg; --confetti-x: -25vw; --confetti-y: -35vh; }
        .completion-confetti span:nth-child(3) { --confetti-color: #3b82f6; --confetti-delay: 80ms; --confetti-rotate: 140deg; --confetti-x: -12vw; --confetti-y: -28vh; }
        .completion-confetti span:nth-child(4) { --confetti-color: #ec4899; --confetti-delay: 30ms; --confetti-rotate: 200deg; --confetti-x: 10vw; --confetti-y: -32vh; }
        .completion-confetti span:nth-child(5) { --confetti-color: #8b5cf6; --confetti-delay: 100ms; --confetti-rotate: 260deg; --confetti-x: 25vw; --confetti-y: -24vh; }
        .completion-confetti span:nth-child(6) { --confetti-color: #f97316; --confetti-delay: 60ms; --confetti-rotate: 320deg; --confetti-x: 35vw; --confetti-y: -36vh; }
        .completion-confetti span:nth-child(7) { --confetti-color: #14b8a6; --confetti-delay: 120ms; --confetti-rotate: 40deg; --confetti-x: -32vw; --confetti-y: 10vh; }
        .completion-confetti span:nth-child(8) { --confetti-color: #eab308; --confetti-delay: 40ms; --confetti-rotate: 110deg; --confetti-x: -18vw; --confetti-y: 18vh; }
        .completion-confetti span:nth-child(9) { --confetti-color: #ef4444; --confetti-delay: 90ms; --confetti-rotate: 180deg; --confetti-x: 18vw; --confetti-y: 16vh; }
        .completion-confetti span:nth-child(10) { --confetti-color: #6366f1; --confetti-delay: 10ms; --confetti-rotate: 240deg; --confetti-x: 32vw; --confetti-y: 8vh; }

        @keyframes completion-pop {
            from { opacity: 0; transform: scale(.82) translateY(0.5rem); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes completion-bounce {
            0%, 100% { transform: translateY(0) rotate(0); }
            35% { transform: translateY(-0.5rem) rotate(-8deg); }
            70% { transform: translateY(0) rotate(8deg); }
        }

        @keyframes completion-sparkle {
            0%, 100% { opacity: .75; transform: scale(.9) rotate(-8deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(8deg); }
        }

        @keyframes completion-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.16); }
        }

        @keyframes completion-sway {
            0%, 100% { transform: rotate(-8deg) translateY(0); }
            50% { transform: rotate(8deg) translateY(-0.25rem); }
        }

        @keyframes confetti-burst {
            from { opacity: 0; transform: translate(-50%, -50%) rotate(var(--confetti-rotate)) scale(.5); }
            15% { opacity: 1; }
            to { opacity: 0; transform: translate(calc(-50% + var(--confetti-x)), calc(-50% + var(--confetti-y))) rotate(calc(var(--confetti-rotate) + 240deg)); }
        }

        @media (prefers-reduced-motion: reduce) {
            .completion-card, .completion-emoji, .completion-confetti span { animation: none; }
            .completion-confetti { display: none; }
        }
    </style>
</head>
<body class="app-shell quiz-shell bg-slate-50 h-[100svh] overflow-hidden flex flex-col items-center p-4">
    <button id="force-update" type="button" class="ds-update-pill hidden fixed left-1/2 top-3 z-[70] -translate-x-1/2 rounded-full border px-4 py-2 text-xs font-bold shadow-lg backdrop-blur-md transition active:scale-95" aria-label="更新網站版本">
        更新版本
    </button>
    <main class="max-w-3xl w-full h-full min-h-0 flex flex-col relative">
        <header class="quiz-header absolute left-0 right-0 top-0 z-20 text-center">
            <button id="back-home" type="button" class="absolute left-2 top-1/2 inline-flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full border border-slate-300 bg-white text-2xl leading-none text-slate-600 shadow-sm hover:bg-slate-100 hover:text-blue-600 transition" aria-label="返回選題">
                <span aria-hidden="true">←</span>
            </button>
            <button id="open-settings" type="button" class="absolute right-2 top-1/2 inline-flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full border border-slate-300 bg-white text-lg leading-none text-slate-600 shadow-sm hover:bg-slate-100 hover:text-blue-600 transition" aria-label="開啟設定">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            </button>
            <p class="text-sm font-semibold tracking-[0.2em] text-blue-600 mb-2">DAILY CHALLENGE</p>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-1">乘法挑戰</h1>
            <div class="quiz-legend flex items-center justify-center gap-1.5" aria-label="題目順序：被乘數乘以乘數">
                <span class="quiz-factor-one">被乘數</span><span aria-hidden="true">×</span><span class="quiz-factor-two">乘數</span>
            </div>
        </header>

        <section id="question-list" class="quiz-question-list grid grid-cols-1 sm:grid-cols-2 gap-2 min-h-0 flex-1" aria-label="測驗題目"></section>
        <div id="quiz-message" class="mt-6 p-4 rounded-xl text-center font-medium hidden" role="alert"></div>
    </main>

    <div id="completion-overlay" class="completion-overlay hidden" aria-live="polite" aria-atomic="true">
        <div class="completion-confetti" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="completion-card">
            <button id="close-completion" type="button" class="completion-close" aria-label="關閉完成提示">×</button>
            <div data-completion-emoji class="completion-emoji" aria-hidden="true">🎉</div>
            <h2 data-completion-title class="mt-2 text-xl font-black text-blue-700">你好棒！</h2>
            <p data-completion-detail class="mt-1 text-sm font-semibold text-slate-600">全部答對，你做到了！</p>
        </div>
    </div>

    <div id="keypad-dock" class="keypad-dock" aria-hidden="true">放回底部</div>
    <div id="number-pad" class="safe-keypad fixed left-0 right-0 z-50 border-t border-slate-200 bg-white/95 px-2 py-2 shadow-lg backdrop-blur-md">
        <button id="close-keypad" type="button" class="keypad-close" aria-label="關閉數字鍵盤">×</button>
        <div id="keypad-handle" class="floating-keypad-handle" aria-label="拖曳移動數字鍵盤">
            <span aria-hidden="true">⠿</span><span class="ml-2 text-xs font-semibold">拖曳鍵盤</span>
        </div>
        <div class="numeric-pad mx-auto max-w-2xl">
            <button type="button" data-pad-value="1" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">1</button>
            <button type="button" data-pad-value="2" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">2</button>
            <button type="button" data-pad-value="3" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">3</button>
            <button type="button" data-pad-value="4" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">4</button>
            <button type="button" data-pad-value="5" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">5</button>
            <button type="button" data-pad-value="6" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">6</button>
            <button type="button" data-pad-value="7" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">7</button>
            <button type="button" data-pad-value="8" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">8</button>
            <button type="button" data-pad-value="9" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">9</button>
            <button type="button" data-pad-value="backspace" class="ds-accent rounded-lg border py-1.5 text-base font-semibold transition active:scale-95" aria-label="刪除最後一個數字">⌫</button>
            <button type="button" data-pad-value="0" class="ds-secondary rounded-lg border py-1.5 text-base font-semibold transition active:scale-95">0</button>
            <button type="button" data-pad-value="next" class="ds-success rounded-lg border py-1.5 text-base font-semibold transition active:scale-95" aria-label="前往下一題">↵</button>
        </div>
    </div>

    <div class="safe-action-bar ds-surface-strong fixed bottom-0 left-0 right-0 z-50 flex min-h-[3.75rem] flex-nowrap items-center gap-1 border-t px-2 shadow-lg backdrop-blur-md sm:gap-2 sm:px-4 md:px-6">
        <div id="completion-actions" class="hidden min-w-0 shrink overflow-x-auto items-center justify-center gap-1 sm:gap-2">
            <button id="return-home-after-quiz" type="button" class="whitespace-nowrap rounded-lg border border-slate-300 bg-slate-100 px-2 py-2 text-xs font-semibold text-slate-700 transition hover:bg-slate-200 sm:px-3 sm:text-sm" aria-label="返回上一頁">← 上一頁</button>
            <button id="another-quiz" type="button" class="whitespace-nowrap rounded-lg border border-blue-200 bg-blue-50 px-2 py-2 text-xs font-semibold text-blue-700 transition hover:bg-blue-100 sm:px-3 sm:text-sm" aria-label="依目前題庫再次出題">↻ 再次出題</button>
            <button id="retry-quiz" type="button" class="whitespace-nowrap rounded-lg border border-emerald-200 bg-emerald-50 px-2 py-2 text-xs font-semibold text-emerald-700 transition hover:bg-emerald-100 sm:px-3 sm:text-sm" aria-label="重新測驗目前題目">↺ 重新測驗</button>
        </div>
            <button id="submit-answer" type="button" class="ml-auto whitespace-nowrap px-3 sm:px-4 py-2 sm:py-2.5 text-sm sm:text-base bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition cursor-pointer">
            對答案
        </button>
    </div>

    <div id="leave-modal" class="ds-modal-backdrop fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/40 p-4" role="presentation">
        <div class="ds-surface-strong ds-modal-surface w-full max-w-sm rounded-2xl p-6 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="leave-title">
            <h2 id="leave-title" class="text-lg font-bold text-slate-800">要離開這次挑戰嗎？</h2>
            <p class="mt-2 text-sm leading-6 text-slate-600">目前的作答進度會被清除，確定要返回選題嗎？</p>
            <div class="mt-5 flex justify-end gap-3">
                <button id="cancel-leave" type="button" class="px-4 py-2.5 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition">繼續作答</button>
                <button id="confirm-leave" type="button" class="px-4 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition">返回選題</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="ds-modal-backdrop fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/40 p-4" role="presentation">
        <div class="ds-surface-strong ds-modal-surface w-full max-w-sm rounded-2xl p-6 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="flex items-center justify-between gap-4">
                <h2 id="settings-title" class="text-lg font-bold text-slate-800">設定</h2>
                <button id="close-settings" type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-xl text-slate-500 hover:bg-slate-100" aria-label="關閉設定">×</button>
            </div>
            <p class="mt-2 text-sm leading-6 text-slate-600">管理你的練習資料與成績統計。</p>
            <div class="mt-5 space-y-3">
                <div>
                    <p class="mb-2 text-sm font-semibold text-slate-700">顯示主題</p>
                    <div class="grid grid-cols-2 gap-2" role="group" aria-label="選擇顯示主題">
                        <button type="button" data-theme-choice="light" aria-pressed="false" class="ds-theme-choice rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition">☀️ 明亮</button>
                        <button type="button" data-theme-choice="dark" aria-pressed="false" class="ds-theme-choice rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition">🌙 深色</button>
                    </div>
                </div>
                <button id="export-records" type="button" class="w-full rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-left text-sm font-semibold text-blue-700 hover:bg-blue-100 transition">匯出成績統計紀錄（CSV）</button>
                <button id="clear-storage" type="button" class="w-full rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-left text-sm font-semibold text-red-700 hover:bg-red-100 transition">清除所有練習紀錄</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260906-084437" defer></script>
</body>
</html>
