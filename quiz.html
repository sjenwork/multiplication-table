<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法小達人｜隨機挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 pb-44">
    <main class="max-w-2xl w-full mb-8">
        <header class="relative text-center mb-6">
            <button id="back-home" type="button" class="absolute left-0 top-0 inline-flex h-9 w-9 items-center justify-center rounded-full border border-slate-300 bg-white text-2xl leading-none text-slate-600 shadow-sm hover:bg-slate-100 hover:text-blue-600 transition" aria-label="返回選題">
                <span aria-hidden="true">←</span>
            </button>
            <p class="text-sm font-semibold tracking-[0.2em] text-blue-600 mb-2">DAILY CHALLENGE</p>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">乘法挑戰</h1>
            <p id="progress" class="text-slate-600 text-sm md:text-base" role="status"></p>
        </header>

        <section id="question-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2" aria-label="測驗題目"></section>
        <div id="quiz-message" class="mt-6 p-4 rounded-xl text-center font-medium hidden" role="alert"></div>
    </main>

    <div id="number-pad" class="fixed bottom-[4.25rem] left-0 right-0 z-50 border-t border-slate-200 bg-white/95 px-2 py-2 shadow-lg backdrop-blur-md">
        <div class="mx-auto grid max-w-2xl grid-cols-7 gap-1">
            <button type="button" data-pad-value="1" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">1</button>
            <button type="button" data-pad-value="2" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">2</button>
            <button type="button" data-pad-value="3" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">3</button>
            <button type="button" data-pad-value="4" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">4</button>
            <button type="button" data-pad-value="5" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">5</button>
            <button type="button" data-pad-value="6" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">6</button>
            <button type="button" data-pad-value="7" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">7</button>
            <button type="button" data-pad-value="8" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">8</button>
            <button type="button" data-pad-value="9" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">9</button>
            <button type="button" data-pad-value="0" class="rounded-lg border border-slate-200 bg-slate-50 py-1.5 text-base font-semibold text-slate-700 hover:bg-blue-50">0</button>
            <button type="button" data-pad-value="backspace" class="rounded-lg border border-slate-200 bg-slate-100 py-1.5 text-base font-semibold text-slate-700 hover:bg-slate-200" aria-label="刪除最後一個數字">⌫</button>
            <button type="button" data-pad-value="clear" class="rounded-lg border border-slate-200 bg-slate-100 py-1.5 text-sm font-semibold text-slate-700 hover:bg-slate-200">清除</button>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg py-2.5 px-2 sm:px-4 md:px-6 flex flex-nowrap items-center gap-2 z-50">
        <button id="submit-answer" type="button" class="ml-auto whitespace-nowrap px-3 sm:px-4 py-2 sm:py-2.5 text-sm sm:text-base bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition cursor-pointer">
            檢查答案
        </button>
    </div>

    <div id="leave-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/40 p-4" role="presentation">
        <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="leave-title">
            <h2 id="leave-title" class="text-lg font-bold text-slate-800">要離開這次挑戰嗎？</h2>
            <p class="mt-2 text-sm leading-6 text-slate-600">目前的作答進度會被清除，確定要返回選題嗎？</p>
            <div class="mt-5 flex justify-end gap-3">
                <button id="cancel-leave" type="button" class="px-4 py-2.5 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition">繼續作答</button>
                <button id="confirm-leave" type="button" class="px-4 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition">返回選題</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260905-123440" defer></script>
</body>
</html>
