<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <title>乘法小達人｜隨機挑戰</title>
    <meta name="theme-color" content="#f4fbff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="乘法小達人">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="pwa.css?v=20260906-190612">
    <link rel="stylesheet" href="tailwind.css?v=20260906-190612">
    <link rel="stylesheet" href="design-tokens.css?v=20260906-190612">
    <script src="app/theme-colors.js?v=20260906-190612" async></script>
    <style>
        .numeric-pad {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.375rem;
        }

        .quiz-header {
            width: 100%;
            padding: 0.75rem 3.25rem;
            border: 1px solid var(--ds-border);
            border-radius: var(--ds-radius-lg);
            background: var(--ds-surface);
            box-shadow: var(--ds-shadow-sm);
            backdrop-filter: var(--ds-blur-surface);
            -webkit-backdrop-filter: var(--ds-blur-surface);
        }

        .quiz-legend {
            color: var(--ds-text-muted);
            font-size: 0.6875rem;
            font-weight: 700;
            line-height: 1;
        }

        .quiz-factor-one {
            color: var(--ds-factor-one);
        }

        .quiz-factor-two {
            color: var(--ds-factor-two);
        }

        .safe-keypad {
            border: 1px solid var(--ds-border);
            background: var(--ds-surface);
            box-shadow: var(--ds-keypad-shadow);
            backdrop-filter: var(--ds-blur-keypad);
            -webkit-backdrop-filter: var(--ds-blur-keypad);
        }

        .floating-keypad {
            left: auto;
            right: auto;
            bottom: auto;
            width: min(18rem, calc(100vw - 1rem));
            border-radius: var(--ds-radius-lg);
            border: 1px solid var(--ds-border);
            background: var(--ds-surface);
            box-shadow: var(--ds-shadow-md);
            backdrop-filter: var(--ds-blur-surface);
            -webkit-backdrop-filter: var(--ds-blur-surface);
            transition: left 180ms ease, top 180ms ease, transform 180ms ease, opacity 180ms ease, box-shadow 180ms ease;
        }

        .safe-keypad:not(.floating-keypad) {
            border-top-left-radius: var(--ds-radius-lg);
            border-top-right-radius: var(--ds-radius-lg);
            background: var(--ds-surface);
            overflow: visible;
        }

        .floating-keypad.keypad-snap-preview {
            transform: scale(0.985);
            opacity: 0.96;
            border-color: var(--ds-focus-border);
            box-shadow: var(--ds-drag-shadow);
        }

        .floating-keypad.is-dragging {
            transition: none;
        }

        .keypad-dock {
            display: none;
            position: fixed;
            z-index: var(--ds-layer-dock);
            align-items: center;
            justify-content: center;
            border: 2px dashed var(--ds-drag-border);
            border-radius: 1rem;
            background: var(--ds-drag-surface);
            color: var(--ds-brand-strong);
            font-size: 0.75rem;
            font-weight: 700;
            pointer-events: none;
            transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
        }

        .keypad-dock.is-visible {
            display: flex;
        }

        .keypad-dock.is-hovered {
            border-color: var(--ds-drag-border-active);
            background: var(--ds-drag-surface-active);
            box-shadow: var(--ds-focus-shadow);
        }

        .floating-keypad-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 1.75rem;
            color: var(--ds-text-muted);
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .floating-keypad-handle:active {
            cursor: grabbing;
        }

        .keypad-close {
            display: flex;
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid var(--ds-control-border);
            border-radius: 9999px;
            background: var(--ds-control-surface);
            color: var(--ds-control-text);
            font-size: 1.25rem;
            line-height: 1;
            box-shadow: var(--ds-control-shadow);
            backdrop-filter: var(--ds-blur-control);
            -webkit-backdrop-filter: var(--ds-blur-control);
        }

        .floating-keypad .keypad-close {
            top: -0.65rem;
            right: -0.65rem;
        }

        .keypad-close:hover {
            background: var(--ds-surface-strong);
            color: var(--ds-brand-strong);
        }

        .completion-overlay {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: var(--ds-layer-completion);
            pointer-events: none;
            overflow: hidden;
            padding: calc(0.75rem + env(safe-area-inset-top)) 1rem 0;
        }

        .completion-overlay.hidden {
            display: none;
        }

        .completion-card {
            position: relative;
            pointer-events: auto;
            width: min(100%, 32rem);
            padding: 0.75rem 1.25rem;
            border: 1px solid var(--ds-border-strong);
            border-radius: 9999px;
            background: var(--ds-surface-strong);
            box-shadow: var(--ds-shadow-md);
            backdrop-filter: var(--ds-blur-control);
            -webkit-backdrop-filter: var(--ds-blur-control);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            animation: completion-pop 420ms cubic-bezier(.22, 1.2, .36, 1) both;
            touch-action: pan-y;
            -webkit-user-select: none;
            user-select: none;
        }

        .completion-card.score-good {
            border-color: var(--ds-accent);
        }

        .completion-card.score-steady {
            border-color: var(--ds-brand);
        }

        .completion-card.score-keep-going {
            border-color: var(--ds-success);
        }

        .completion-card.score-good .completion-emoji {
            animation-name: completion-sparkle;
        }

        .completion-card.score-steady .completion-emoji {
            animation-name: completion-pulse;
        }

        .completion-card.score-keep-going .completion-emoji {
            animation-name: completion-sway;
        }

        .completion-close {
            position: absolute;
            top: -0.65rem;
            right: -0.65rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border: 1px solid var(--ds-border);
            border-radius: 9999px;
            background: var(--ds-surface-strong);
            color: var(--ds-text-muted);
            font-size: 1.25rem;
            line-height: 1;
            pointer-events: auto;
            box-shadow: var(--ds-shadow-sm);
            backdrop-filter: var(--ds-blur-control);
            -webkit-backdrop-filter: var(--ds-blur-control);
        }

        .completion-close:hover {
            background: var(--ds-surface-strong);
            color: var(--ds-brand-strong);
        }

        .completion-emoji {
            font-size: 1.5rem;
            line-height: 1;
            animation: completion-bounce 700ms ease-in-out both;
        }

        .quiz-question-list {
            overflow-y: auto;
            overscroll-behavior: contain;
            align-content: start;
            align-items: start;
            grid-auto-rows: max-content;
            padding-top: var(--quiz-header-reserve, 7rem);
            padding-bottom: var(--quiz-scroll-reserve, 15rem);
            scrollbar-gutter: stable;
        }

        .quiz-question-card {
            background: var(--ds-surface);
            border-color: var(--ds-border);
            backdrop-filter: var(--ds-blur-table);
            -webkit-backdrop-filter: var(--ds-blur-table);
        }

        .quiz-question-card.quiz-card-success {
            background: var(--ds-success-soft);
            border-color: var(--ds-success);
        }

        .quiz-question-card.quiz-card-error {
            background: var(--ds-danger-soft);
            border-color: var(--ds-danger);
        }

        .quiz-question-card.quiz-card-idle {
            border-color: var(--ds-border);
        }

        .completion-confetti {
            position: absolute;
            inset: 0;
        }

        .completion-confetti span {
            position: absolute;
            top: 42%;
            left: 50%;
            width: 0.55rem;
            height: 1rem;
            border-radius: 999px;
            background: var(--confetti-color);
            animation: confetti-burst 1200ms cubic-bezier(.15, .8, .35, 1) both;
            animation-delay: var(--confetti-delay);
            transform: rotate(var(--confetti-rotate));
        }

        .completion-confetti span:nth-child(1) { --confetti-color: var(--ds-confetti-1); --confetti-delay: 20ms; --confetti-rotate: 12deg; --confetti-x: -35vw; --confetti-y: -25vh; }
        .completion-confetti span:nth-child(2) { --confetti-color: var(--ds-confetti-2); --confetti-delay: 50ms; --confetti-rotate: 80deg; --confetti-x: -25vw; --confetti-y: -35vh; }
        .completion-confetti span:nth-child(3) { --confetti-color: var(--ds-confetti-3); --confetti-delay: 80ms; --confetti-rotate: 140deg; --confetti-x: -12vw; --confetti-y: -28vh; }
        .completion-confetti span:nth-child(4) { --confetti-color: var(--ds-confetti-4); --confetti-delay: 30ms; --confetti-rotate: 200deg; --confetti-x: 10vw; --confetti-y: -32vh; }
        .completion-confetti span:nth-child(5) { --confetti-color: var(--ds-confetti-5); --confetti-delay: 100ms; --confetti-rotate: 260deg; --confetti-x: 25vw; --confetti-y: -24vh; }
        .completion-confetti span:nth-child(6) { --confetti-color: var(--ds-confetti-6); --confetti-delay: 60ms; --confetti-rotate: 320deg; --confetti-x: 35vw; --confetti-y: -36vh; }
        .completion-confetti span:nth-child(7) { --confetti-color: var(--ds-confetti-7); --confetti-delay: 120ms; --confetti-rotate: 40deg; --confetti-x: -32vw; --confetti-y: 10vh; }
        .completion-confetti span:nth-child(8) { --confetti-color: var(--ds-confetti-8); --confetti-delay: 40ms; --confetti-rotate: 110deg; --confetti-x: -18vw; --confetti-y: 18vh; }
        .completion-confetti span:nth-child(9) { --confetti-color: var(--ds-confetti-9); --confetti-delay: 90ms; --confetti-rotate: 180deg; --confetti-x: 18vw; --confetti-y: 16vh; }
        .completion-confetti span:nth-child(10) { --confetti-color: var(--ds-confetti-10); --confetti-delay: 10ms; --confetti-rotate: 240deg; --confetti-x: 32vw; --confetti-y: 8vh; }

        @keyframes completion-pop {
            from { opacity: 0; transform: scale(.82) translateY(0.5rem); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes completion-bounce {
            0%, 100% { transform: translateY(0) rotate(0); }
            35% { transform: translateY(-0.5rem) rotate(-8deg); }
            70% { transform: translateY(0) rotate(8deg); }
        }

        @keyframes completion-sparkle {
            0%, 100% { opacity: .75; transform: scale(.9) rotate(-8deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(8deg); }
        }

        @keyframes completion-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.16); }
        }

        @keyframes completion-sway {
            0%, 100% { transform: rotate(-8deg) translateY(0); }
            50% { transform: rotate(8deg) translateY(-0.25rem); }
        }

        @keyframes confetti-burst {
            from { opacity: 0; transform: translate(-50%, -50%) rotate(var(--confetti-rotate)) scale(.5); }
            15% { opacity: 1; }
            to { opacity: 0; transform: translate(calc(-50% + var(--confetti-x)), calc(-50% + var(--confetti-y))) rotate(calc(var(--confetti-rotate) + 240deg)); }
        }

        @media (prefers-reduced-motion: reduce) {
            .completion-card, .completion-emoji, .completion-confetti span { animation: none; }
            .completion-confetti { display: none; }
        }
    </style>
</head>
<body class="app-shell quiz-shell h-[100svh] overflow-hidden flex flex-col items-center p-4">
    <button id="force-update" type="button" class="ds-update-pill ds-layer-update hidden fixed left-1/2 top-3 -translate-x-1/2 rounded-full border px-4 py-2 text-xs font-bold shadow-lg backdrop-blur-md transition active:scale-95" aria-label="更新網站版本">
        更新版本
    </button>
    <main class="max-w-3xl w-full h-full min-h-0 flex flex-col relative">
        <header class="quiz-header ds-layer-header absolute left-0 right-0 top-0 text-center">
            <button id="back-home" type="button" class="ds-icon-button absolute left-2 top-1/2 inline-flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full text-2xl leading-none transition" aria-label="返回選題">
                <span aria-hidden="true">←</span>
            </button>
            <button id="open-settings" type="button" class="ds-icon-button absolute right-2 top-1/2 inline-flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full text-lg leading-none transition" aria-label="開啟設定">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            </button>
            <p class="ds-brand-text text-sm font-semibold tracking-[0.2em] mb-2">DAILY CHALLENGE</p>
            <h1 class="ds-text-strong text-2xl md:text-3xl font-bold mb-1">乘法挑戰</h1>
            <div class="quiz-legend flex items-center justify-center gap-1.5" aria-label="題目順序：被乘數乘以乘數">
                <span class="quiz-factor-one">被乘數</span><span aria-hidden="true">×</span><span class="quiz-factor-two">乘數</span>
            </div>
        </header>

        <section id="question-list" class="quiz-question-list grid grid-cols-1 sm:grid-cols-2 gap-2 min-h-0 flex-1" aria-label="測驗題目"></section>
        <div id="quiz-message" class="mt-6 p-4 rounded-xl text-center font-medium hidden" role="alert"></div>
    </main>

    <app-completion-overlay id="completion-overlay" class="completion-overlay hidden" aria-live="polite" aria-atomic="true"></app-completion-overlay>

    <div id="keypad-dock" class="keypad-dock" aria-hidden="true">放回底部</div>
    <app-keypad id="number-pad" class="safe-keypad ds-layer-keypad fixed left-0 right-0 px-2 py-2"></app-keypad>

    <div class="safe-action-bar ds-surface-strong ds-layer-keypad fixed bottom-0 left-0 right-0 flex min-h-[3.75rem] flex-nowrap items-center gap-1 border-t px-2 sm:gap-2 sm:px-4 md:px-6">
        <div id="completion-actions" class="hidden min-w-0 shrink overflow-x-auto items-center justify-center gap-1 sm:gap-2">
            <app-button id="return-home-after-quiz" variant="secondary" size="sm" class="whitespace-nowrap px-2 text-xs sm:px-3 sm:text-sm" aria-label="返回上一頁">← 上一頁</app-button>
            <app-button id="another-quiz" variant="primary" size="sm" class="whitespace-nowrap px-2 text-xs sm:px-3 sm:text-sm" aria-label="依目前題庫再次出題">↻ 再次出題</app-button>
            <app-button id="retry-quiz" variant="success" size="sm" class="whitespace-nowrap px-2 text-xs sm:px-3 sm:text-sm" aria-label="重新測驗目前題目">↺ 重新測驗</app-button>
        </div>
            <app-button id="submit-answer" variant="primary" size="md" class="ml-auto whitespace-nowrap shadow-md text-sm sm:text-base">對答案</app-button>
    </div>

        <app-modal id="leave-modal" size="sm" labelledby="leave-title">
            <h2 id="leave-title" class="ds-text-strong text-lg font-bold">要離開這次挑戰嗎？</h2>
            <p class="ds-text-muted mt-2 text-sm leading-6">目前的作答進度會被清除，確定要返回選題嗎？</p>
                <div class="mt-5 flex justify-end gap-3">
                    <app-button id="cancel-leave" data-modal-close variant="secondary" size="md">繼續作答</app-button>
                    <app-button id="confirm-leave" variant="primary" size="md">返回選題</app-button>
                </div>
        </app-modal>

    <script src="app.js?v=20260906-190612" type="module"></script>
</body>
</html>
