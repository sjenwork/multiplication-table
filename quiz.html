<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法小達人｜隨機挑戰</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 pb-28">
    <main class="max-w-2xl w-full mb-8">
        <header class="text-center mb-6">
            <p class="text-sm font-semibold tracking-[0.2em] text-blue-600 mb-2">DAILY CHALLENGE</p>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">乘法挑戰</h1>
            <p id="progress" class="text-slate-600 text-sm md:text-base" role="status"></p>
        </header>

        <section id="question-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2" aria-label="測驗題目"></section>
        <div id="quiz-message" class="mt-6 p-4 rounded-xl text-center font-medium hidden" role="alert"></div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg py-4 px-6 flex justify-center items-center gap-4 z-50">
        <button id="submit-answer" type="button" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition cursor-pointer">
            檢查答案
        </button>
        <button id="back-home" type="button" class="px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl transition cursor-pointer">
            返回選題
        </button>
    </div>

    <script src="app.js?v=20260905-120826" defer></script>
</body>
</html>
