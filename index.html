<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法表互動練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell-highlight {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 pb-28">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-8">
        <header class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">九九乘法表互動練習</h1>
            <p class="text-slate-600 text-sm md:text-base">請在空格中填入正確的相乘積數，完成後點擊畫面下方固定的按鈕檢查！</p>
        </header>

        <!-- 狀態顯示列 -->
        <div id="status-bar" class="mb-6 p-4 bg-blue-50 border border-blue-100 rounded-xl text-center text-blue-800 font-medium hidden">
            <!-- 動態填入檢查結果提示 -->
        </div>

        <!-- 乘法表容器 -->
        <div class="overflow-x-auto pb-4">
            <div id="multiplication-grid" class="grid grid-cols-10 gap-1 md:gap-2 min-w-[650px] text-center">
                <!-- 動態生成表格內容 -->
            </div>
        </div>
    </div>

    <!-- 固定在畫面下方的操作列（不會隨捲動消失） -->
    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg py-4 px-6 flex justify-center items-center gap-4 z-50">
        <button onclick="checkAnswers()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition flex items-center gap-2 cursor-pointer">
            <span>確認答案</span>
        </button>
        <button onclick="resetTable()" class="px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl transition cursor-pointer">
            重新填寫
        </button>
    </div>

    <script>
        function initTable() {
            const grid = document.getElementById('multiplication-grid');
            grid.innerHTML = '';

            // 建立表頭 (第一列)
            const emptyCorner = document.createElement('div');
            emptyCorner.className = "p-2 font-bold text-slate-400 bg-slate-100 rounded-lg flex items-center justify-center";
            emptyCorner.textContent = "×";
            grid.appendChild(emptyCorner);

            for (let c = 1; c <= 9; c++) {
                const th = document.createElement('div');
                th.className = "p-2 font-bold text-slate-700 bg-slate-100 rounded-lg flex items-center justify-center text-sm md:text-base";
                th.textContent = c;
                grid.appendChild(th);
            }

            // 建立內容列 (1 到 9)
            for (let r = 1; r <= 9; r++) {
                // 列首標題
                const rh = document.createElement('div');
                rh.className = "p-2 font-bold text-slate-700 bg-slate-100 rounded-lg flex items-center justify-center text-sm md:text-base";
                rh.textContent = r;
                grid.appendChild(rh);

                for (let c = 1; c <= 9; c++) {
                    const cell = document.createElement('div');
                    const product = r * c;

                    cell.className = `p-2 rounded-lg transition flex flex-col items-center justify-center border border-slate-200 bg-slate-50 relative text-xs md:text-sm`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.dataset.answer = product;

                    cell.innerHTML = `
                        <span class="text-slate-400 text-[10px] md:text-xs mb-1">${r}×${c}</span>
                        <div class="relative w-full flex items-center justify-center">
                            <input type="number"
                                class="w-14 md:w-16 text-center py-1 bg-white border border-slate-300 rounded-md font-bold text-slate-800 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                                data-row="${r}" data-col="${c}" data-answer="${product}"
                                oninput="clearError(this)">
                            <span class="absolute right-1 text-base font-bold hidden status-icon"></span>
                        </div>
                    `;

                    grid.appendChild(cell);
                }
            }
        }

        function clearError(input) {
            const cell = input.closest('div[data-row]');
            cell.className = "p-2 rounded-lg transition flex flex-col items-center justify-center border border-slate-200 bg-slate-50 relative text-xs md:text-sm";
            const icon = cell.querySelector('.status-icon');
            icon.classList.add('hidden');
            icon.textContent = '';
            input.classList.remove('border-red-500', 'bg-red-50', 'border-green-500', 'bg-green-50');
        }

        function checkAnswers() {
            const inputs = document.querySelectorAll('#multiplication-grid input');
            let allCorrect = true;
            let correctCount = 0;
            let totalCount = inputs.length;

            inputs.forEach(input => {
                const userVal = parseInt(input.value.trim());
                const ans = parseInt(input.dataset.answer);
                const cell = input.closest('div[data-row]');
                const icon = cell.querySelector('.status-icon');

                if (isNaN(userVal)) {
                    allCorrect = false;
                    cell.className = "p-2 rounded-lg transition flex flex-col items-center justify-center border border-red-300 bg-red-50 relative text-xs md:text-sm";
                    input.classList.add('border-red-500', 'bg-red-50');
                    icon.textContent = '❌';
                    icon.classList.remove('hidden');
                } else if (userVal === ans) {
                    correctCount++;
                    cell.className = "p-2 rounded-lg transition flex flex-col items-center justify-center border border-green-300 bg-green-50 relative text-xs md:text-sm";
                    input.classList.add('border-green-500', 'bg-green-50');
                    input.classList.remove('border-red-500', 'bg-red-50');
                    icon.textContent = '✓';
                    icon.classList.remove('hidden', 'text-red-500');
                    icon.classList.add('text-green-600');
                } else {
                    allCorrect = false;
                    cell.className = "p-2 rounded-lg transition flex flex-col items-center justify-center border border-red-300 bg-red-50 relative text-xs md:text-sm";
                    input.classList.add('border-red-500', 'bg-red-50');
                    input.classList.remove('border-green-500', 'bg-green-50');
                    icon.textContent = '❌';
                    icon.classList.remove('hidden', 'text-green-600');
                    icon.classList.add('text-red-500');
                }
            });

            const statusBar = document.getElementById('status-bar');
            statusBar.classList.remove('hidden');
            if (allCorrect) {
                statusBar.className = "mb-6 p-4 bg-green-50 border border-green-200 rounded-xl text-center text-green-800 font-medium";
                statusBar.innerHTML = `🎉 太棒了！全部 ${totalCount} 個答案完全正確！`;
            } else {
                statusBar.className = "mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl text-center text-amber-800 font-medium";
                statusBar.innerHTML = `⚠️ 檢查完畢：目前答對 <span class="font-bold">${correctCount}</span> / ${totalCount} 題。錯誤的格子已標上 <span class="text-red-600 font-bold">❌</span>，請直接修改數字後再次確認！`;
            }
        }

        function resetTable() {
            const inputs = document.querySelectorAll('#multiplication-grid input');
            inputs.forEach(input => {
                input.value = '';
                clearError(input);
            });
            document.getElementById('status-bar').classList.add('hidden');
        }

        // 初始化表格
        window.onload = initTable;
    </script>
</body>
</html>
