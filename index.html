<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <title>乘法小達人｜九九乘法練習</title>
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="乘法小達人">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="pwa.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #multiplication-grid.selection-dragging {
            outline: 3px solid rgb(59 130 246 / 0.22);
            outline-offset: 2px;
        }

        #multiplication-grid.selection-haptic-fallback {
            animation: selection-feedback 180ms ease-out;
        }

        @keyframes selection-feedback {
            0%, 100% { transform: translateX(0); }
            35% { transform: translateX(-2px); }
            70% { transform: translateX(2px); }
        }
    </style>
</head>
<body class="app-shell bg-slate-50 h-[100svh] overflow-hidden flex flex-col items-center p-4 pb-20">
    <button id="force-update" type="button" class="hidden fixed left-1/2 top-3 z-[70] -translate-x-1/2 rounded-full border border-blue-200/70 bg-white/70 px-4 py-2 text-xs font-bold text-blue-700 shadow-lg backdrop-blur-md transition hover:bg-white/85 active:scale-95" aria-label="更新網站版本">
        更新版本
    </button>
    <main class="max-w-6xl w-full flex-1 min-h-0 flex flex-col">
        <header class="relative text-center mb-6">
            <button id="open-settings" type="button" class="absolute right-0 top-0 inline-flex h-9 w-9 items-center justify-center rounded-full border border-slate-300 bg-white text-lg leading-none text-slate-600 shadow-sm hover:bg-slate-100 hover:text-blue-600 transition" aria-label="開啟設定">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            </button>
            <p class="text-sm font-semibold tracking-[0.2em] text-blue-600 mb-2">MULTIPLICATION MASTER</p>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">乘法小達人</h1>
            <p class="text-slate-600 text-sm md:text-base">可選擇 10 題以上；每次挑戰從已選題目中隨機出 10 題。</p>
        </header>

        <div class="mb-4 rounded-xl border border-blue-100 bg-blue-50/70 px-4 py-3 text-center text-sm text-blue-800">
            點擊格子即可選題；長按後滑動可快速多選或取消。可選超過 10 題，每次隨機出 10 題，少於 10 題則全部出題。
        </div>

        <div data-selection-scroll class="flex-1 min-h-0 overflow-auto rounded-xl pb-2 isolate" tabindex="0" aria-label="九九乘法表，可上下左右捲動；長按格子後滑動可批次選題">
            <table id="multiplication-grid" class="w-full min-w-[650px] table-fixed border-separate border-spacing-1 text-center"></table>
        </div>
    </main>

    <div class="safe-action-bar fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg py-2.5 px-2 sm:px-4 md:px-6 flex flex-nowrap items-center gap-2 z-50">
        <p id="selection-status" class="text-xs sm:text-sm font-medium leading-tight text-slate-600 flex-1 min-w-0" role="status"></p>
        <div class="flex items-center gap-2 shrink-0">
            <button id="start-wrong-quiz" type="button" class="whitespace-nowrap px-3 sm:px-4 py-2 sm:py-2.5 text-sm sm:text-base bg-amber-500 hover:bg-amber-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition cursor-pointer" disabled>
                錯題優先
            </button>
            <button id="start-quiz" type="button" class="whitespace-nowrap px-3 sm:px-4 py-2 sm:py-2.5 text-sm sm:text-base bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition cursor-pointer">
                開始挑戰
            </button>
            <button id="clear-selection" type="button" class="whitespace-nowrap px-3 sm:px-4 py-2 sm:py-2.5 text-sm sm:text-base bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl transition cursor-pointer">
                重新選擇
            </button>
        </div>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/40 p-4" role="presentation">
        <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="flex items-center justify-between gap-4">
                <h2 id="settings-title" class="text-lg font-bold text-slate-800">設定</h2>
                <button id="close-settings" type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-full text-xl text-slate-500 hover:bg-slate-100" aria-label="關閉設定">×</button>
            </div>
            <p class="mt-2 text-sm leading-6 text-slate-600">管理你的練習資料與成績統計。</p>
            <div class="mt-5 space-y-3">
                <button id="export-records" type="button" class="w-full rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 text-left text-sm font-semibold text-blue-700 hover:bg-blue-100 transition">匯出成績統計紀錄（CSV）</button>
                <button id="clear-storage" type="button" class="w-full rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-left text-sm font-semibold text-red-700 hover:bg-red-100 transition">清除所有練習紀錄</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=20260905-160105" defer></script>
</body>
</html>
