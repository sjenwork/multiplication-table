<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法小達人｜九九乘法練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 h-[100svh] overflow-hidden flex flex-col items-center p-4 pb-20">
    <main class="max-w-6xl w-full flex-1 min-h-0 flex flex-col">
        <header class="text-center mb-6">
            <p class="text-sm font-semibold tracking-[0.2em] text-blue-600 mb-2">MULTIPLICATION MASTER</p>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">乘法小達人</h1>
            <p class="text-slate-600 text-sm md:text-base">挑選想加強的題目，開始一場最多 10 題的隨機挑戰。</p>
        </header>

        <div class="flex-1 min-h-0 overflow-auto rounded-xl pb-2 isolate" tabindex="0" aria-label="九九乘法表，可上下左右捲動">
            <table id="multiplication-grid" class="w-full min-w-[650px] table-fixed border-separate border-spacing-1 text-center"></table>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg py-2.5 px-2 sm:px-4 md:px-6 flex flex-nowrap items-center gap-2 z-50">
        <p id="selection-status" class="text-xs sm:text-sm font-medium leading-tight text-slate-600 flex-1 min-w-0" role="status"></p>
        <div class="flex items-center gap-2 shrink-0">
            <button id="start-quiz" type="button" class="whitespace-nowrap px-3 sm:px-4 py-2 sm:py-2.5 text-sm sm:text-base bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition cursor-pointer">
                開始挑戰
            </button>
            <button id="clear-selection" type="button" class="whitespace-nowrap px-3 sm:px-4 py-2 sm:py-2.5 text-sm sm:text-base bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl transition cursor-pointer">
                重新選擇
            </button>
        </div>
    </div>

    <script src="app.js?v=20260905-121421" defer></script>
</body>
</html>
