<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1">
    <title>乘法小達人｜九九乘法練習</title>
    <meta name="theme-color" content="#f4fbff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="乘法小達人">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="pwa.css?v=20260906-142216">
    <link rel="stylesheet" href="tailwind.css?v=20260906-142216">
    <link rel="stylesheet" href="design-tokens.css?v=20260906-142216">
    <script src="app/theme-colors.js?v=20260906-142216" async></script>
    <style>
        #multiplication-grid.selection-dragging {
            outline: 3px solid var(--ds-focus-ring);
            outline-offset: 2px;
        }

        #multiplication-grid.selection-haptic-fallback {
            animation: selection-feedback 180ms ease-out;
        }

        @keyframes selection-feedback {
            0%, 100% { transform: translateX(0); }
            35% { transform: translateX(-2px); }
            70% { transform: translateX(2px); }
        }
    </style>
</head>
    <body class="app-shell h-[100svh] overflow-hidden flex flex-col items-center p-4 pb-20">
    <button id="force-update" type="button" class="ds-update-pill ds-layer-update hidden fixed left-1/2 top-3 -translate-x-1/2 rounded-full border px-4 py-2 text-xs font-bold shadow-lg backdrop-blur-md transition active:scale-95" aria-label="更新網站版本">
        更新版本
    </button>
    <main class="max-w-6xl w-full flex-1 min-h-0 flex flex-col">
        <header class="relative text-center mb-6">
            <button id="open-settings" type="button" class="ds-icon-button absolute right-0 top-1/2 inline-flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-full text-lg leading-none transition" aria-label="開啟設定">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            </button>
            <p class="ds-brand-text text-sm font-semibold tracking-[0.2em] mb-2">MULTIPLICATION MASTER</p>
            <h1 class="ds-text-strong text-2xl md:text-3xl font-bold mb-2">乘法小達人</h1>
        </header>

        <div class="ds-surface mb-4 rounded-xl px-4 py-3 text-center text-sm">
            點選或長按滑動選題；每次隨機 10 題，不足則全部出題。
        </div>

        <div data-selection-scroll class="flex-1 min-h-0 overflow-auto rounded-xl pb-2 isolate" tabindex="0" aria-label="九九乘法表，可上下左右捲動；長按格子後滑動可批次選題">
            <multiplication-selector id="multiplication-grid"></multiplication-selector>
        </div>
    </main>

    <div class="safe-action-bar ds-surface-strong ds-layer-keypad fixed bottom-0 left-0 right-0 border-t py-2.5 px-2 sm:px-4 md:px-6 flex flex-nowrap items-center gap-2">
        <p id="selection-status" class="ds-text-muted text-xs sm:text-sm font-medium leading-tight flex-1 min-w-0" role="status"></p>
        <div class="flex items-center gap-2 shrink-0">
            <app-button id="start-random-quiz" variant="primary" size="md" class="whitespace-nowrap rounded-xl shadow-md text-sm sm:text-base">隨機出題</app-button>
            <app-button id="start-wrong-quiz" variant="accent" size="md" class="whitespace-nowrap rounded-xl shadow-md text-sm sm:text-base" disabled>錯題優先</app-button>
            <app-button id="start-quiz" variant="primary" size="md" class="whitespace-nowrap rounded-xl shadow-md text-sm sm:text-base" disabled>開始挑戰</app-button>
        </div>
    </div>

    <script src="app.js?v=20260906-142216" type="module"></script>
</body>
</html>
