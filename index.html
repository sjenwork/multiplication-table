<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法表互動練習</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 pb-28">
    <main class="max-w-4xl w-full mb-8">
        <header class="text-center mb-6">
            <p class="text-sm font-semibold tracking-[0.2em] text-blue-600 mb-2">MULTIPLICATION PRACTICE</p>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">九九乘法表互動練習</h1>
            <p class="text-slate-600 text-sm md:text-base">勾選想練習的題目，開始一輪最多 10 題的隨機測驗。</p>
        </header>

        <div id="selection-status" class="mb-6 p-4 bg-blue-50 border border-blue-100 rounded-xl text-center text-blue-800 font-medium" role="status"></div>

        <div class="max-h-[min(60vh,36rem)] overflow-auto rounded-xl pb-2 isolate" tabindex="0" aria-label="九九乘法表，可上下左右捲動">
            <table id="multiplication-grid" class="min-w-[650px] border-separate border-spacing-1 text-center"></table>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-lg py-4 px-6 flex justify-center items-center gap-4 z-50">
        <button id="start-quiz" type="button" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-md transition cursor-pointer">
            開始測驗
        </button>
        <button id="clear-selection" type="button" class="px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-xl transition cursor-pointer">
            清除勾選
        </button>
    </div>

    <script src="app.js?v=2160904" defer></script>
</body>
</html>
